# Check and monitor types: capitalize the type word, lowercase "check" or "monitor".
# "Playwright Check Suite" and "Agentic Check" are product names and keep their capitals.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
swap:
  '(?:Browser|browser) Checks': Browser checks
  '(?:Browser|browser) Check': Browser check
  'browser checks?(?= (?:in|on|with|run|that|for)\b)': Browser check
  'API Checks': API checks
  'API Check': API check
  '(?:MultiStep|Multi-step|Multi-Step|multi-step|multistep) checks': Multistep checks
  '(?:MultiStep|Multi-step|Multi-Step|multi-step|multistep) check': Multistep check
  'Multistep Checks': Multistep checks
  'Multistep Check': Multistep check
  'URL Monitors': URL monitors
  'URL Monitor': URL monitor
  'TCP Monitors': TCP monitors
  'TCP Monitor': TCP monitor
  'DNS Monitors': DNS monitors
  'DNS Monitor': DNS monitor
  'ICMP Monitors': ICMP monitors
  'ICMP Monitor': ICMP monitor
  'SSL Monitors': SSL monitors
  'SSL Monitor': SSL monitor
  'gRPC Monitors': gRPC monitors
  'gRPC Monitor': gRPC monitor
  '(?:GRPC|Grpc) [Mm]onitors': gRPC monitors
  '(?:GRPC|Grpc) [Mm]onitor': gRPC monitor
  '(?:Traceroute|traceroute) Monitors': Traceroute monitors
  '(?:Traceroute|traceroute) Monitor': Traceroute monitor
  '(?:Heartbeat|heartbeat) Monitors': Heartbeat monitors
  '(?:Heartbeat|heartbeat) Monitor': Heartbeat monitor
  'heartbeat monitors': Heartbeat monitors
  'heartbeat monitor': Heartbeat monitor
  'Playwright (?:check suites|Check suites|check Suites)': Playwright Check Suites
  'Playwright (?:check suite|Check suite|check Suite)': Playwright Check Suite
