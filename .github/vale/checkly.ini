# Vale config for the casing check (.github/scripts/check-casing.mjs).
# Only the Checkly style runs here, so the check blocks on our own rules and
# nothing else. The repo's main .vale.ini keeps the broader writing styles.
StylesPath = ../../styles
MinAlertLevel = error

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Checkly

[*.mdx]
CommentDelimiters = {/*, */}
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`)
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})
