<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="22" font-weight="600">Where a request breaks, and who notices</text>
  <text x="40" y="66" fill="#6b7280">Six hops sit between a user and your code. Only the first is the same for everyone. Every other hop depends on where the user is.</text>

  <!-- Hop boxes -->
  <g font-weight="600" text-anchor="middle">
    <rect x="40"  y="110" width="160" height="64" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="120" y="138">User's device</text><text x="120" y="160" font-weight="400" fill="#6b7280" font-size="13">browser, app</text>
    <rect x="232" y="110" width="160" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="312" y="138">DNS</text><text x="312" y="160" font-weight="400" fill="#6b7280" font-size="13">resolver, geo / anycast</text>
    <rect x="424" y="110" width="160" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="504" y="138">CDN edge</text><text x="504" y="160" font-weight="400" fill="#6b7280" font-size="13">nearest PoP, cache, WAF</text>
    <rect x="616" y="110" width="160" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="696" y="138">Transit</text><text x="696" y="160" font-weight="400" fill="#6b7280" font-size="13">ISP peering, BGP routes</text>
    <rect x="808" y="110" width="160" height="64" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="888" y="138">Cloud region</text><text x="888" y="160" font-weight="400" fill="#6b7280" font-size="13">load balancer, TLS, app</text>
    <rect x="1000" y="110" width="160" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1080" y="138">Your code</text><text x="1080" y="160" font-weight="400" fill="#6b7280" font-size="13">and third parties it calls</text>
  </g>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#a)">
    <line x1="200" y1="142" x2="230" y2="142"/><line x1="392" y1="142" x2="422" y2="142"/><line x1="584" y1="142" x2="614" y2="142"/><line x1="776" y1="142" x2="806" y2="142"/><line x1="968" y1="142" x2="998" y2="142"/>
  </g>

  <!-- Scope band -->
  <rect x="232" y="196" width="928" height="26" rx="6" fill="#fef3c7"/>
  <text x="696" y="214" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">Different for every region: the answer, the PoP, the route, and the region a user lands in all depend on where they are</text>
  <rect x="40" y="196" width="160" height="26" rx="6" fill="#e5e7eb"/>
  <text x="120" y="214" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">Same everywhere</text>

  <!-- Failure examples column per hop -->
  <g font-size="13">
    <text x="312" y="256" text-anchor="middle" fill="#dc2626" font-weight="600">Regional failure looks like</text>
    <g fill="#374151">
      <text x="312" y="280" text-anchor="middle">stale geo-DNS record</text>
      <text x="312" y="300" text-anchor="middle">one anycast node misrouted</text>
      <text x="312" y="320" text-anchor="middle">ISP resolver caching a bad answer</text>
    </g>
    <text x="504" y="256" text-anchor="middle" fill="#dc2626" font-weight="600">Regional failure looks like</text>
    <g fill="#374151">
      <text x="504" y="280" text-anchor="middle">one PoP returning 503s</text>
      <text x="504" y="300" text-anchor="middle">a WAF rule blocking a country</text>
      <text x="504" y="320" text-anchor="middle">stale cache in one PoP only</text>
    </g>
    <text x="696" y="256" text-anchor="middle" fill="#dc2626" font-weight="600">Regional failure looks like</text>
    <g fill="#374151">
      <text x="696" y="280" text-anchor="middle">congested peering link</text>
      <text x="696" y="300" text-anchor="middle">BGP route leak or hijack</text>
      <text x="696" y="320" text-anchor="middle">submarine cable cut</text>
    </g>
    <text x="888" y="256" text-anchor="middle" fill="#dc2626" font-weight="600">Regional failure looks like</text>
    <g fill="#374151">
      <text x="888" y="280" text-anchor="middle">one region or AZ degraded</text>
      <text x="888" y="300" text-anchor="middle">TLS cert missing an intermediate</text>
      <text x="888" y="320" text-anchor="middle">a stale deploy in one region</text>
    </g>
    <text x="1080" y="256" text-anchor="middle" fill="#dc2626" font-weight="600">Regional failure looks like</text>
    <g fill="#374151">
      <text x="1080" y="280" text-anchor="middle">payment provider down in EU</text>
      <text x="1080" y="300" text-anchor="middle">analytics script blocked locally</text>
      <text x="1080" y="320" text-anchor="middle">geo-blocked feature flag</text>
    </g>
  </g>

  <!-- Who sees it -->
  <line x1="40" y1="350" x2="1160" y2="350" stroke="#e5e7eb"/>
  <text x="40" y="380" font-weight="600">Who notices first</text>
  <g font-size="14">
    <rect x="40" y="396" width="14" height="14" rx="3" fill="#16a34a"/><text x="62" y="408">A monitor that runs from that region: within one check interval.</text>
    <rect x="40" y="424" width="14" height="14" rx="3" fill="#dc2626"/><text x="62" y="436">A monitor that runs only next to the origin: never. It takes none of those hops.</text>
    <rect x="40" y="452" width="14" height="14" rx="3" fill="#d97706"/><text x="62" y="464">Your users in that region: immediately. Support hears about it an hour later, if they bother to write.</text>
  </g>
  <text x="1160" y="500" text-anchor="end" font-size="13" fill="#9ca3af">Origin-side metrics (CPU, error rate, APM) cover the last two hops only.</text>
</svg>
