<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" font-size="22" font-weight="600">One vantage point tells you about one path</text>
  <text x="40" y="66" fill="#6b7280">A monitor next to the origin sees the origin. Users see the whole route, and every route is different.</text>

  <!-- Origin -->
  <rect x="520" y="230" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="268" text-anchor="middle" font-weight="600">Origin</text>
  <text x="600" y="292" text-anchor="middle" fill="#6b7280" font-size="14">us-east-1, healthy</text>

  <!-- Single monitor, next to origin -->
  <rect x="520" y="100" width="160" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-weight="600">Monitor</text>
  <text x="600" y="152" text-anchor="middle" fill="#16a34a" font-size="14">us-east-1 · 100% up</text>
  <line x1="600" y1="170" x2="600" y2="228" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="612" y="205" fill="#16a34a" font-size="14">24 ms</text>

  <!-- Edges / paths -->
  <!-- Frankfurt: healthy -->
  <rect x="60" y="180" width="170" height="70" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="145" y="208" text-anchor="middle" font-weight="600">Edge · Frankfurt</text>
  <text x="145" y="230" text-anchor="middle" fill="#16a34a" font-size="14">serving</text>
  <line x1="230" y1="215" x2="518" y2="262" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="100" width="170" height="50" rx="25" fill="#f3f4f6"/>
  <text x="145" y="131" text-anchor="middle" font-size="15">Users in Europe 😊</text>
  <line x1="145" y1="150" x2="145" y2="178" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- São Paulo: slow -->
  <rect x="60" y="330" width="170" height="70" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="145" y="358" text-anchor="middle" font-weight="600">Edge · São Paulo</text>
  <text x="145" y="380" text-anchor="middle" fill="#d97706" font-size="14">peering congested · 2.8 s</text>
  <line x1="230" y1="365" x2="518" y2="300" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="60" y="430" width="170" height="50" rx="25" fill="#f3f4f6"/>
  <text x="145" y="461" text-anchor="middle" font-size="15">Users in Brazil 😐</text>
  <line x1="145" y1="430" x2="145" y2="402" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sydney: down -->
  <rect x="970" y="330" width="170" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1055" y="358" text-anchor="middle" font-weight="600">Edge · Sydney</text>
  <text x="1055" y="380" text-anchor="middle" fill="#dc2626" font-size="14">PoP down · 503</text>
  <line x1="970" y1="365" x2="682" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <text x="820" y="356" text-anchor="middle" fill="#dc2626" font-size="26" font-weight="700">✕</text>
  <rect x="970" y="430" width="170" height="50" rx="25" fill="#f3f4f6"/>
  <text x="1055" y="461" text-anchor="middle" font-size="15">Users in Australia 😡</text>
  <line x1="1055" y1="430" x2="1055" y2="402" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tokyo: DNS stale -->
  <rect x="970" y="180" width="170" height="70" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="1055" y="208" text-anchor="middle" font-weight="600">Resolver · Tokyo</text>
  <text x="1055" y="230" text-anchor="middle" fill="#d97706" font-size="14">stale geo-DNS answer</text>
  <line x1="970" y1="215" x2="682" y2="262" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="970" y="100" width="170" height="50" rx="25" fill="#f3f4f6"/>
  <text x="1055" y="131" text-anchor="middle" font-size="15">Users in Japan 😐</text>
  <line x1="1055" y1="150" x2="1055" y2="178" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom callout -->
  <rect x="40" y="500" width="1120" height="40" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="600" y="526" text-anchor="middle" font-size="15">The dashboard says <tspan fill="#16a34a" font-weight="600">100% uptime</tspan>. A quarter of your users cannot check out. Both are true, because they measure different paths.</text>
</svg>
