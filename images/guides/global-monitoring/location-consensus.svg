<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="40" y="40" font-size="22" font-weight="600">More locations, fewer pages: make the regions vote</text>
  <text x="40" y="66" fill="#6b7280">Retry in the region that failed, then alert only when enough regions agree. One noisy path stops waking people up, a real outage still does.</text>

  <!-- Scenario A -->
  <rect x="40" y="96" width="540" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="126" font-weight="600">A. One region has a bad path</text>
  <g text-anchor="middle" font-size="13">
    <circle cx="120" cy="190" r="26" fill="#16a34a"/><text x="120" y="196" fill="#fff" font-weight="600">OK</text><text x="120" y="236">Virginia</text>
    <circle cx="240" cy="190" r="26" fill="#16a34a"/><text x="240" y="196" fill="#fff" font-weight="600">OK</text><text x="240" y="236">Frankfurt</text>
    <circle cx="360" cy="190" r="26" fill="#16a34a"/><text x="360" y="196" fill="#fff" font-weight="600">OK</text><text x="360" y="236">Singapore</text>
    <circle cx="480" cy="190" r="26" fill="#dc2626"/><text x="480" y="196" fill="#fff" font-weight="600">✕</text><text x="480" y="236">Sydney</text>
  </g>
  <!-- retry in same region -->
  <path d="M480,216 C480,270 500,270 500,290" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#c)"/>
  <rect x="404" y="290" width="152" height="40" rx="8" fill="#fff" stroke="#d1d5db"/>
  <text x="480" y="310" text-anchor="middle" font-size="12" font-weight="600">retry · same region</text>
  <text x="480" y="324" text-anchor="middle" font-size="12" fill="#dc2626">still failing</text>
  <!-- vote -->
  <rect x="60" y="352" width="500" height="34" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="310" y="374" text-anchor="middle" font-size="13">1 of 4 locations failing = <tspan font-weight="600">25%</tspan>, threshold <tspan font-weight="600">50%</tspan></text>
  <rect x="60" y="400" width="500" height="40" rx="8" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="310" y="425" text-anchor="middle" font-size="14" fill="#166534" font-weight="600">No page. Result is recorded and visible per location.</text>

  <!-- Scenario B -->
  <rect x="620" y="96" width="540" height="360" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="640" y="126" font-weight="600">B. The service is down</text>
  <g text-anchor="middle" font-size="13">
    <circle cx="700" cy="190" r="26" fill="#dc2626"/><text x="700" y="196" fill="#fff" font-weight="600">✕</text><text x="700" y="236">Virginia</text>
    <circle cx="820" cy="190" r="26" fill="#dc2626"/><text x="820" y="196" fill="#fff" font-weight="600">✕</text><text x="820" y="236">Frankfurt</text>
    <circle cx="940" cy="190" r="26" fill="#dc2626"/><text x="940" y="196" fill="#fff" font-weight="600">✕</text><text x="940" y="236">Singapore</text>
    <circle cx="1060" cy="190" r="26" fill="#16a34a"/><text x="1060" y="196" fill="#fff" font-weight="600">OK</text><text x="1060" y="236">Sydney</text>
  </g>
  <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#c)">
    <path d="M700,216 C700,260 720,260 720,290"/><path d="M820,216 C820,260 840,260 840,290"/><path d="M940,216 C940,260 960,260 960,290"/>
  </g>
  <rect x="644" y="290" width="112" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text x="700" y="310" text-anchor="middle" font-size="11" font-weight="600">retry · same region</text><text x="700" y="324" text-anchor="middle" font-size="12" fill="#dc2626">still failing</text>
  <rect x="764" y="290" width="112" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text x="820" y="310" text-anchor="middle" font-size="11" font-weight="600">retry · same region</text><text x="820" y="324" text-anchor="middle" font-size="12" fill="#dc2626">still failing</text>
  <rect x="884" y="290" width="112" height="40" rx="8" fill="#fff" stroke="#d1d5db"/><text x="940" y="310" text-anchor="middle" font-size="11" font-weight="600">retry · same region</text><text x="940" y="324" text-anchor="middle" font-size="12" fill="#dc2626">still failing</text>
  <rect x="640" y="352" width="500" height="34" rx="6" fill="#fff" stroke="#d1d5db"/>
  <text x="890" y="374" text-anchor="middle" font-size="13">3 of 4 locations failing = <tspan font-weight="600">75%</tspan>, threshold <tspan font-weight="600">50%</tspan></text>
  <rect x="640" y="400" width="500" height="40" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="890" y="425" text-anchor="middle" font-size="14" fill="#991b1b" font-weight="600">Alert. Sydney still passing points at the CDN or region routing.</text>

  <text x="40" y="484" font-size="13" fill="#9ca3af">Retrying from a different region would have hidden scenario A entirely. Same-region retries keep the evidence; the threshold decides whether it is a page.</text>
</svg>
