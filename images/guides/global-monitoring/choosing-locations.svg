<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
  <text x="40" y="40" font-size="22" font-weight="600">Choosing locations: three questions, not twenty-two boxes</text>
  <text x="40" y="66" fill="#6b7280">Pick from where your users are, where your infrastructure is, and one place that is neither. Add private locations for what the internet cannot reach.</text>

  <!-- Three columns -->
  <g>
    <rect x="40" y="96" width="350" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="215" y="130" text-anchor="middle" font-weight="600" font-size="17">1. Where are your users?</text>
    <text x="60" y="162" font-size="14" fill="#374151">Take the top regions from analytics.</text>
    <text x="60" y="184" font-size="14" fill="#374151">One location per region that matters</text>
    <text x="60" y="204" font-size="14" fill="#374151">to revenue, not per country.</text>
    <text x="60" y="240" font-size="13" fill="#6b7280">e.g. 60% US, 25% EU, 10% India</text>
    <g font-size="13">
      <rect x="60" y="256" width="108" height="26" rx="13" fill="#fff" stroke="#2563eb"/><text x="114" y="274" text-anchor="middle">us-east-1</text>
      <rect x="176" y="256" width="120" height="26" rx="13" fill="#fff" stroke="#2563eb"/><text x="236" y="274" text-anchor="middle">eu-central-1</text>
      <rect x="60" y="290" width="108" height="26" rx="13" fill="#fff" stroke="#2563eb"/><text x="114" y="308" text-anchor="middle">ap-south-1</text>
    </g>
  </g>
  <g>
    <rect x="425" y="96" width="350" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="130" text-anchor="middle" font-weight="600" font-size="17">2. Where does it run?</text>
    <text x="445" y="162" font-size="14" fill="#374151">One location in each cloud region you</text>
    <text x="445" y="182" font-size="14" fill="#374151">deploy to. A regional deploy that goes</text>
    <text x="445" y="202" font-size="14" fill="#374151">wrong is then visible on its own row.</text>
    <text x="445" y="240" font-size="13" fill="#6b7280">e.g. active in Oregon, failover in Ireland</text>
    <g font-size="13">
      <rect x="445" y="256" width="108" height="26" rx="13" fill="#fff" stroke="#16a34a"/><text x="499" y="274" text-anchor="middle">us-west-2</text>
      <rect x="561" y="256" width="108" height="26" rx="13" fill="#fff" stroke="#16a34a"/><text x="615" y="274" text-anchor="middle">eu-west-1</text>
    </g>
  </g>
  <g>
    <rect x="810" y="96" width="350" height="250" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="985" y="130" text-anchor="middle" font-weight="600" font-size="17">3. One control, far away</text>
    <text x="830" y="162" font-size="14" fill="#374151">A location with no users and no</text>
    <text x="830" y="182" font-size="14" fill="#374151">infrastructure. If only this one fails,</text>
    <text x="830" y="202" font-size="14" fill="#374151">the problem is the path, not the service.</text>
    <text x="830" y="240" font-size="13" fill="#6b7280">Also your worst-case latency baseline.</text>
    <g font-size="13">
      <rect x="830" y="256" width="130" height="26" rx="13" fill="#fff" stroke="#d97706"/><text x="895" y="274" text-anchor="middle">ap-southeast-2</text>
      <text x="972" y="274" font-size="12" fill="#6b7280">or af-south-1, sa-east-1</text>
    </g>
  </g>

  <!-- Private location strip -->
  <rect x="40" y="370" width="1120" height="80" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="60" y="396" font-weight="600">Private locations</text>
  <text x="60" y="418" font-size="14" fill="#374151">An agent inside your VPC, office, or a partner's data centre. For internal tools, pre-production, and</text>
  <text x="60" y="438" font-size="14" fill="#374151">"does it work from the customer's network?" questions that public locations cannot answer.</text>

  <text x="40" y="478" font-size="13" fill="#9ca3af">Start with five or six. Add a location when a real incident would have been caught sooner by it, not before.</text>
</svg>
