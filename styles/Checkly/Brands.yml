# Third-party and product names use their official casing.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
swap:
  'Github': GitHub
  'Gitlab': GitLab
  'Javascript': JavaScript
  'Typescript': TypeScript
  'Node(?:JS|js|Js|\.JS)(?! plugin)': Node.js
  'Open ?[Tt]elemetry|Opentelemetry': OpenTelemetry
  'OpsGenie': Opsgenie
  'Pagerduty|PagerDUTY': PagerDuty
  'Hashicorp': HashiCorp
  'Kubernetes(?=s)|kubernetes(?= (?:cluster|deployment|pod))': Kubernetes
  'MS Teams': Microsoft Teams
