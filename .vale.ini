StylesPath = styles

MinAlertLevel = suggestion

# No Packages line on purpose: the styles are committed under styles/ and pinned.
# With a Packages line, Mintlify downloads the latest releases on every run, and
# the Nov 19, 2026 releases of proselint, write-good and alex need Vale 3.28.1+,
# which broke Mintlify's vale-spellcheck check. Update styles/ deliberately instead.

[*.{md}]
# ^ This section applies to only Markdown files.
#
# You can change (or add) file extensions here
# to apply these settings to other file types.
#
# For example, to apply these settings to both
# Markdown and reStructuredText:
#
# [*.{md,rst}]
BasedOnStyles = Vale, Google, proselint, write-good, alex
[formats]
mdx = md

[*.mdx]
CommentDelimiters = {/*, */}

TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>)

BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?sm)^({.+.*})
